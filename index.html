<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Tech Times</title>
<meta name="description" content="A magazine-style front page for the past year in technology, with live CRT wires from Hacker News.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=DM+Mono:wght@400;500&family=VT323&display=swap">
<style>
/* Magazine sections as flip-through pages: giant misregistered section title, boxed cards on newsprint, side tabs to the neighbouring sections, each section printed in its own ink. CRT terminals carry the live wire. */
:root{
  --paper:#EEE8DC; --card:#F6F2E9; --ink:#1A1916; --soft:#5E5A51; --hair:rgba(26,25,22,.22);
  --k:#E0452B; --k2:#2155E0;
  --crt-bg:#07110C; --crt-fg:#8DFFAE; --crt-dim:#3E8A57;
  --f-title:"Archivo","Arial Black",Impact,sans-serif;
  --f-head:"Instrument Serif","Times New Roman",Georgia,serif;
  --f-body:"Newsreader",Georgia,serif;
  --f-label:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-crt:"VT323","DM Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--k);outline-offset:3px}

/* chrome */
.shell{max-width:1240px;margin:0 auto;padding-block:12px 80px;
  padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(64px,env(safe-area-inset-right,0px))}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-bottom:6px}
.iconbtn{justify-self:start;background:none;border:1px solid var(--ink);height:34px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.iconbtn:hover{background:var(--ink);color:var(--paper)}
.iconbtn[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:#fff}
.burger{width:16px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}
.burger::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:2px solid currentColor}
.brand{font-family:var(--f-title);font-weight:800;font-stretch:100%;font-size:14px;letter-spacing:.02em;text-align:center;white-space:nowrap}
.brand small{display:block;font-family:var(--f-label);font-weight:400;font-size:10.5px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}
.tright{justify-self:end;display:flex;gap:8px}

/* side tabs */
.tab{position:fixed;top:50%;z-index:20;transform:translateY(-50%);writing-mode:vertical-rl;background:none;border:0;cursor:pointer;
  font-family:var(--f-title);font-weight:800;font-stretch:115%;font-size:12px;letter-spacing:.22em;text-transform:uppercase;padding:18px 10px;color:var(--soft);transition:color .2s}
.tab:hover{color:var(--tk,var(--ink))}
.tab.prev{left:max(8px,env(safe-area-inset-left,0px));transform:translateY(-50%) rotate(180deg)}
.tab.next{right:max(8px,env(safe-area-inset-right,0px))}
.tab::before{content:"";display:block;width:8px;height:8px;margin:0 auto 10px;background:var(--tk,var(--ink));transform:rotate(45deg)}

/* section title */
.title-wrap{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 0 4px;text-align:center;overflow:hidden}
.stitle{margin:0;font-family:var(--f-title);font-weight:900;font-stretch:125%;font-size:clamp(52px,10.5vw,150px);line-height:.92;letter-spacing:-.01em;text-transform:uppercase;position:relative;display:inline-block}
.stitle .reg{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply}
.stitle .r1{color:var(--k);transform:translate(6px,4px)}
.stitle .r2{color:var(--k2);opacity:.75;transform:translate(-4px,-2px)}
.stitle .main{position:relative;color:var(--ink);mix-blend-mode:multiply}
.stitle .ch{display:inline-block;animation:drop .55s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes drop{from{transform:translateY(-38%);opacity:0}to{transform:none;opacity:1}}
.subline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-label);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:8px 0 0}

/* grid */
.page{animation:pagein .45s ease both}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:18px}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.row2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start}
.row3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:18px}

.box{background:var(--card);border:1px solid var(--hair);padding:14px;min-width:0;position:relative}
.card{cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--k)}
.card:focus-visible{outline-offset:2px}
.art{display:block;width:100%;background:var(--ink);aspect-ratio:16/10}
.hero .art{aspect-ratio:16/9.2}
.hl{font-family:var(--f-head);font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.005em}
.hero{padding:16px 16px 20px;text-align:center;align-items:center}
.hero .hl{font-size:clamp(30px,3.6vw,46px);max-width:24ch}
.hero .dek{max-width:60ch}
.dek{margin:0;font-size:14.5px;color:var(--soft);line-height:1.45}
.by{font-family:var(--f-label);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.by b{color:var(--k);font-weight:500}
.card .hl{font-size:24px}
.card.text .hl{font-size:21px}
.card.mini{justify-content:center;text-align:center;min-height:120px}
.card.mini .hl{font-size:19px}
.pill{align-self:flex-start;font-family:var(--f-label);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--k);color:var(--k);padding:2px 7px}
.hero .pill{align-self:center}

/* feature (explainer) box */
.feature{border:1px solid var(--k);outline:1px solid var(--k);outline-offset:-7px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:7px 7px 0 var(--k2)}
.feature .lab{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--k)}
.feature .medal{width:120px;height:120px;border-radius:50%;background:var(--ink);overflow:hidden;border:1px solid var(--k)}
.feature .medal canvas{width:100%;height:100%;display:block}
.feature h3{margin:0;font-family:var(--f-head);font-weight:400;font-size:26px;line-height:1.05}
.feature p{margin:0;font-size:14.5px;line-height:1.5}

/* number card */
.numcard{border:1px solid var(--k);text-align:center;padding:20px 14px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;background:var(--card)}
.numcard .fig{font-family:var(--f-title);font-weight:800;font-stretch:112%;font-size:clamp(40px,4.4vw,58px);line-height:1;color:var(--k);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.numcard p{margin:0;font-size:14px;max-width:26ch}
.numcard a{font-family:var(--f-label);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}

/* CRT terminal */
.crt{background:var(--crt-bg);color:var(--crt-fg);border:1px solid #000;padding:0;position:relative;overflow:hidden;border-radius:14px;box-shadow:inset 0 0 0 6px #111,inset 0 0 40px rgba(0,0,0,.9),0 10px 0 -4px var(--k)}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}48%{opacity:.92}50%{opacity:.82}52%{opacity:.95}}
.crt .scr{position:relative;z-index:2;padding:16px 16px 14px;font-family:var(--f-crt);font-size:19px;line-height:1.15;text-shadow:0 0 6px rgba(141,255,174,.55),1px 0 0 rgba(255,60,90,.35),-1px 0 0 rgba(60,140,255,.35)}
.crt .head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;color:var(--crt-fg);border-bottom:1px dashed var(--crt-dim);padding-bottom:6px;margin-bottom:8px;font-size:18px}
.crt .head button{background:none;border:1px solid var(--crt-dim);color:var(--crt-fg);font-family:var(--f-crt);font-size:17px;padding:0 6px;cursor:pointer}
.crt .head button:hover{background:var(--crt-fg);color:var(--crt-bg)}
.crt ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.crt li a{text-decoration:none;display:block}
.crt li a:hover{background:var(--crt-fg);color:var(--crt-bg);text-shadow:none}
.crt .m{color:var(--crt-dim);font-size:16px}
.crt .cursor{display:inline-block;width:9px;height:17px;background:var(--crt-fg);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.crt .foot{color:var(--crt-dim);font-size:16px;margin-top:10px}

/* liquid glass lens */
.lens-zone{position:relative;border:1px solid var(--hair);background:var(--paper);height:150px;overflow:hidden;width:100%;touch-action:none}
.lens-zone .bg{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px 8px;padding:10px;font-family:var(--f-title);font-weight:900;font-stretch:120%;font-size:22px;line-height:1;text-transform:uppercase;user-select:none}
.lens-zone .bg span:nth-child(3n){color:var(--k)}.lens-zone .bg span:nth-child(3n+1){color:var(--k2)}
.lens{position:absolute;width:96px;height:64px;border-radius:999px;left:30px;top:40px;cursor:grab;
  -webkit-backdrop-filter:blur(2px) saturate(190%) brightness(1.08) contrast(1.1);backdrop-filter:blur(2px) saturate(190%) brightness(1.08) contrast(1.1);
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 45%,rgba(255,255,255,.25));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -6px 14px rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.7)}
.lens:active{cursor:grabbing}
.lens-hint{font-family:var(--f-label);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}

/* menu overlay */
.menu{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));overflow:auto}
.menu .mhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.menu .mhead button{background:none;border:1px solid var(--paper);color:var(--paper);padding:6px 12px;cursor:pointer;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em}
.menu ul{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
.menu li button{background:none;border:0;border-bottom:1px solid rgba(238,232,220,.2);width:100%;text-align:left;padding:10px 0;cursor:pointer;color:var(--paper);display:flex;align-items:baseline;gap:12px;
  font-family:var(--f-title);font-weight:900;font-stretch:120%;font-size:clamp(26px,3.6vw,40px);text-transform:uppercase;line-height:1}
.menu li button i{width:14px;height:14px;flex:none;transform:rotate(45deg)}
.menu li button span{font-family:var(--f-label);font-size:12px;font-weight:400;letter-spacing:.06em;opacity:.6;margin-left:auto}
.menu li button:hover{color:var(--hc)}

/* reader */
.reader{position:fixed;inset:0;z-index:60;background:rgba(26,25,22,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);max-width:720px;width:100%;max-height:100%;overflow:auto;border:1px solid var(--ink);box-shadow:10px 10px 0 var(--k);animation:up .28s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes up{from{transform:translateY(24px) scale(.98)}}
.sheet .art{aspect-ratio:16/8}
.sheet .in{padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px}
.sheet .hl{font-size:clamp(30px,4.4vw,44px)}
.sheet .dek{font-size:18px;font-style:italic;color:var(--ink)}
.sheet .sum{margin:0;font-size:17px}
.sheet .why{border-left:4px solid var(--k);padding:4px 0 4px 12px;font-size:16px}
.sheet .why b{display:block;font-family:var(--f-label);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--k)}
.sheet .acts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:12px}
.btn{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:var(--card);padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.k{background:var(--k);border-color:var(--k);color:#fff}
.btn.k:hover{filter:brightness(.9);background:var(--k);color:#fff}

.mobilenav{display:none}
footer{margin-top:36px;border-top:1px solid var(--ink);padding-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;color:var(--soft)}

/* global CRT mode */
.crtfx{position:fixed;inset:0;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%);animation:flick 5s infinite}
body.crtmode .hl,body.crtmode .stitle .main{text-shadow:1.5px 0 0 rgba(255,40,90,.45),-1.5px 0 0 rgba(40,140,255,.45)}
body.crtmode .shell{filter:contrast(1.1) saturate(1.35) brightness(1.03)}
body.crt-boot .shell{animation:boot .7s ease both}
@keyframes boot{0%{transform:scaleY(.004) scaleX(.6);filter:brightness(4)}45%{transform:scaleY(.01) scaleX(1);filter:brightness(3)}100%{transform:none;filter:none}}

@media (max-width:1000px){
  .row1{grid-template-columns:1fr}
  .side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .row2,.row3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px}
  .tab{display:none}
  .side,.row2,.row3{grid-template-columns:1fr}
  .topbar .tright .lbl{display:none}
  .mobilenav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--paper);justify-content:space-between;gap:8px;
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mobilenav button{background:none;border:1px solid rgba(238,232,220,.4);color:var(--paper);padding:8px 10px;font-family:var(--f-label);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button class="tab prev" id="tabPrev" type="button"></button>
<button class="tab next" id="tabNext" type="button"></button>

<div class="shell">
  <div class="topbar">
    <button class="iconbtn" id="menuBtn" type="button" aria-label="All sections"><span class="burger"></span><span class="lbl">Sections</span></button>
    <div class="brand">The Tech Times<small id="dateline"></small></div>
    <div class="tright">
      <button class="iconbtn" id="shuffleBtn" type="button" title="Open a random story">⤭ <span class="lbl">Shuffle</span></button>
      <button class="iconbtn" id="crtBtn" type="button" aria-pressed="false" title="Toggle CRT mode (C)">CRT</button>
    </div>
  </div>
  <div id="page"></div>
  <footer><span>The Tech Times · an independent fan project. Every story links to its original reporting.</span><span>← → flip sections · C toggles CRT · Esc closes</span></footer>
</div>

<div class="mobilenav"><button type="button" id="mPrev"></button><button type="button" id="mNext"></button></div>
<div class="crtfx" id="crtfx" hidden></div>
<div class="menu" id="menu" hidden role="dialog" aria-modal="true" aria-label="Sections">
  <div class="mhead"><span>The Tech Times · Sections</span><button type="button" id="menuClose">Close</button></div>
  <ul id="menuList"></ul>
</div>
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rHl"></div>

   c.save();c.globalCompositeOperation="destination-out";c.beginPath();c.arc(u(.39),u(.47),u(.06),0,7);c.arc(u(.61),u(.47),u(.06),0,7);c.fill();c.fillRect(u(.37),u(.6),u(.26),u(.04));c.restore();c.fillRect(u(.34),u(.74),u(.32),u(.14));},
 egg(c,u){c.beginPath();c.ellipse(u(.5),u(.55),u(.26),u(.34),0,0,7);c.fill();c.globalAlpha=.4;c.beginPath();c.ellipse(u(.42),u(.42),u(.07),u(.11),-.4,0,7);c.save();c.globalCompositeOperation="destination-out";c.fill();c.restore();c.globalAlpha=1;},
 atom(c,u){c.lineWidth=u(.03);[0,1.05,2.1].forEach(a=>{c.beginPath();c.ellipse(u(.5),u(.5),u(.38),u(.13),a,0,7);c.stroke();});c.beginPath();c.arc(u(.5),u(.5),u(.08),0,7);c.fill();},
 eye(c,u){c.beginPath();c.moveTo(u(.08),u(.5));c.quadraticCurveTo(u(.5),u(.1),u(.92),u(.5));c.quadraticCurveTo(u(.5),u(.9),u(.08),u(.5));c.fill();c.save();c.globalCompositeOperation="destination-out";c.beginPath();c.arc(u(.5),u(.5),u(.17),0,7);c.fill();c.restore();c.beginPath();c.arc(u(.5),u(.5),u(.09),0,7);c.fill();},
 star(c,u){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?.14:.4;c.lineTo(u(.5+Math.cos(a)*r),u(.5+Math.sin(a)*r));}c.closePath();c.fill();},
 three(c,u){[[.3,.62],[.5,.32],[.7,.62]].forEach((p,i)=>{c.globalAlpha=[.6,1,.8][i];c.beginPath();c.arc(u(p[0]),u(p[1]),u(.19),0,7);c.fill();});c.globalAlpha=1;},
 window(c,u){[[.18,.18],[.52,.18],[.18,.52],[.52,.52]].forEach(p=>c.fillRect(u(p[0]),u(p[1]),u(.3),u(.3)));}
};
const ARTS=new Set();
function hexToRgb(h){h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function makeArt(kind,ink,variant,seed){
  const cv=el("canvas","art");cv.setAttribute("aria-hidden","true");
  const st={cv,kind,ink,variant,seed:seed||1,lx:.3,ly:.25,mx:-1,my:-1,mask:null,cols:0,rows:0,t:0};
  ARTS.add(st);return st;
}
function buildMask(st){
  const r=st.cv.getBoundingClientRect();if(!r.width)return false;
  const cell=Math.max(6,Math.round(r.width/70));
  st.cell=cell;st.cols=Math.ceil(r.width/cell);st.rows=Math.ceil(r.height/cell);
  const m=document.createElement("canvas");m.width=st.cols;m.height=st.rows;const c=m.getContext("2d",{willReadFrequently:true});
  c.fillStyle="#000";c.fillRect(0,0,m.width,m.height);c.fillStyle="#fff";c.strokeStyle="#fff";c.lineCap="round";c.lineJoin="round";
  const S=Math.min(m.width,m.height)*.92;const ox=(m.width-S)/2+(st.variant===2?m.width*.18:0),oy=(m.height-S)/2;
  const u=v=>v*S;c.save();c.translate(ox,oy);(PICT[st.kind]||PICT.star)(c,u);c.restore();
  st.mask=c.getImageData(0,0,m.width,m.height).data;
  const dpr=Math.min(2,devicePixelRatio||1);st.cv.width=Math.round(r.width*dpr);st.cv.height=Math.round(r.height*dpr);st.dpr=dpr;st.w=r.width;st.h=r.height;
  return true;
}
function drawArt(st){
  if(!st.mask&&!buildMask(st))return;
  const c=st.cv.getContext("2d");c.setTransform(st.dpr,0,0,st.dpr,0,0);
  const dark=st.variant!==1;
  const bg=dark?"#16140F":"#EFE9DC";c.fillStyle=bg;c.fillRect(0,0,st.w,st.h);
  const [ir,ig,ib]=hexToRgb(st.ink);
  const cell=st.cell,cols=st.cols,rows=st.rows;
  const lx=st.lx*cols,ly=st.ly*rows,mx=st.mx*cols,my=st.my*rows;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const i=(y*cols+x)*4;const shape=st.mask[i]/255;
    const d=Math.hypot(x-lx,y-ly)/Math.max(cols,rows);const light=Math.max(0,1-d*1.5);
    let v=Math.max(shape*(.55+.45*light),light*.32);
    if(st.mx>=0){const dm=Math.hypot(x-mx,y-my);v*=1+.6*Math.max(0,1-dm/9)*Math.sin(dm*.9-st.t*.012);}
    if(v<.04)continue;
    const rad=Math.min(.62,Math.sqrt(v)*.6)*cell;
    if(dark){c.fillStyle=shape>.3?`rgb(${ir},${ig},${ib})`:`rgba(238,232,220,${.35+.5*light})`;}
    else{c.fillStyle=shape>.3?"#1A1916":`rgba(${ir},${ig},${ib},.85)`;}
    c.beginPath();c.arc(x*cell+cell/2,y*cell+cell/2,rad,0,6.283);c.fill();
  }
}
function wireArt(st){
  const cv=st.cv;
  cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();st.mx=(e.clientX-r.left)/r.width;st.my=(e.clientY-r.top)/r.height;st.lx=st.mx;st.ly=st.my;if(!st.anim)animate(st);});
  cv.addEventListener("pointerleave",()=>{st.mx=-1;st.my=-1;st.lx=.3;st.ly=.25;st.anim=false;drawArt(st);});
}
function animate(st){if(reduce){drawArt(st);return;}st.anim=true;const step=t=>{if(!st.anim||st.mx<0)return;st.t=t;drawArt(st);requestAnimationFrame(step);};requestAnimationFrame(step);}
const ro=new ResizeObserver(es=>es.forEach(e=>{const st=[...ARTS].find(a=>a.cv===e.target);if(st){st.mask=null;drawArt(st);}}));

/* ---------- live CRT wire ---------- */
function crtBox(sec){
  const box=el("div","box crt");const scr=el("div","scr");
  const head=el("div","head");const label=sec.hn?`>HN/${sec.hn.toUpperCase()}`:">HN/FRONT";
  head.append(el("span",null,label));const btn=el("button",null,"[R]efresh");btn.type="button";head.append(btn);
  const ol=el("ol");const li=el("li");li.append("BOOTING WIRE ",el("span","cursor"));ol.append(li);
  const foot=el("div","foot","");
  scr.append(head,ol,foot);box.append(scr);
  const load=async()=>{
    ol.replaceChildren();const l=el("li");l.append("DIALING HACKER NEWS… ",el("span","cursor"));ol.append(l);
    try{
      const week=Math.floor(Date.now()/1000)-7*86400;
      const url=sec.hn?`https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(sec.hn)}&tags=story&numericFilters=created_at_i>${week},points>30&hitsPerPage=7`
                      :"https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=8";
      const r=await fetch(url);if(!r.ok)throw 0;const data=await r.json();
      const hits=(data.hits||[]).filter(h=>h.title).slice(0,sec.hn?7:8);
      ol.replaceChildren();
      if(!hits.length){ol.append(el("li",null,"NO SIGNAL THIS WEEK."));}
      hits.forEach((h,i)=>{const li=el("li");const disc="https://news.ycombinator.com/item?id="+encodeURIComponent(h.objectID);
        const href=(typeof h.url==="string"&&/^https?:\/\//.test(h.url))?h.url:disc;
        const a=ext(el("a"),href);a.textContent="";li.append(a);
        const m=el("div","m",`${h.points||0} PTS · ${h.num_comments||0} COMMENTS`);li.append(m);ol.append(li);
        typeText(a,`${String(i+1).padStart(2,"0")} ${h.title}`,i*120);});
      foot.textContent="LAST SYNC "+new Date().toLocaleTimeString("en-NZ",{hour:"2-digit",minute:"2-digit"})+" · LIVE";
    }catch(e){ol.replaceChildren();ol.append(el("li",null,"CARRIER LOST. CHECK CONNECTION, THEN PRESS [R]."));foot.textContent="";}
  };
  btn.onclick=load;box._load=load;load();
  return box;
}
function typeText(node,text,delay){
  if(reduce){node.textContent=text;return;}
  let i=0;setTimeout(function tick(){node.textContent=text.slice(0,i+=3);if(i<text.length)setTimeout(tick,14);},delay);
}

/* ---------- cards ---------- */
function storyCard(s,kind,sec){
  const ink=secOf(s.sec).k;
  const c=el("article","box card "+kind);c.tabIndex=0;c.setAttribute("role","button");c.setAttribute("aria-label","Open: "+s.hl);
  if(kind==="hero"||kind==="pic"){const st=makeArt(s.art,ink,kind==="hero"?0:(s.id.length%3),s.id.length);c.append(st.cv);wireArt(st);c._art=st;}
  if(sec.id==="front"||kind==="hero")c.append(el("span","pill",secOf(s.sec).short));
  c.append(el("h3","hl",s.hl));
  if(kind!=="mini"&&s.dek)c.append(el("p","dek",s.dek));
  const by=el("div","by");by.append(el("b",null,fmt(s))," · "+s.src);c.append(by);
  c.style.setProperty("--k",ink);
  const open=()=>openReader(s);c.addEventListener("click",open);c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
  return c;
}
function featureBox(sec){
  const f=sec.feat;const b=el("div","box feature");
  b.append(el("div","lab",f.lab));
  const medal=el("div","medal");const st=makeArt(f.art,sec.k,1,7);medal.append(st.cv);wireArt(st);b.append(medal);b._art=st;
  b.append(el("h3",null,f.h),el("p",null,f.p));
  if(f.lens){
    const z=el("div","lens-zone");const bg=el("div","bg");"Liquid Glass refracts blurs tints iOS 27 Apple design depth light".split(" ").forEach(w=>bg.append(el("span",null,w)));
    const lens=el("div","lens");lens.setAttribute("aria-label","Draggable glass lens");lens.tabIndex=0;z.append(bg,lens);b.append(z,el("div","lens-hint","Drag the glass · or use arrow keys"));
    let drag=null;
    lens.addEventListener("pointerdown",e=>{drag={x:e.clientX-lens.offsetLeft,y:e.clientY-lens.offsetTop};lens.setPointerCapture(e.pointerId);});
    lens.addEventListener("pointermove",e=>{if(!drag)return;const W=z.clientWidth-lens.offsetWidth,H=z.clientHeight-lens.offsetHeight;
      lens.style.left=Math.max(0,Math.min(W,e.clientX-drag.x))+"px";lens.style.top=Math.max(0,Math.min(H,e.clientY-drag.y))+"px";});
    lens.addEventListener("pointerup",()=>drag=null);
    lens.addEventListener("keydown",e=>{const d={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(!d)return;e.preventDefault();e.stopPropagation();
      const W=z.clientWidth-lens.offsetWidth,H=z.clientHeight-lens.offsetHeight;lens.style.left=Math.max(0,Math.min(W,lens.offsetLeft+d[0]))+"px";lens.style.top=Math.max(0,Math.min(H,lens.offsetTop+d[1]))+"px";});
  }
  return b;
}
function numBox(sec){
  const n=sec.num;const b=el("div","box numcard");const fig=el("div","fig",n.fig);b.append(fig,el("p",null,n.text),ext(el("a",null,n.src+" ↗"),n.url));
  countUp(fig,n.fig);return b;
}
function countUp(node,text){
  const m=text.match(/^([^\d]*)([\d,]*\.?\d+)(.*)$/);if(!m||reduce)return;
  const pre=m[1],raw=m[2],post=m[3];const target=parseFloat(raw.replace(/,/g,""));const dec=(raw.split(".")[1]||"").length;const commas=raw.includes(",");
  const t0=performance.now(),D=1100;
  const step=t=>{const p=Math.min(1,(t-t0)/D);const e=1-Math.pow(1-p,3);let v=(target*e).toFixed(dec);if(commas)v=Number(v).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
    node.textContent=pre+v+post;if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);
}

/* ---------- page render ---------- */
let current=0;
function render(idx){
  current=(idx+SECTIONS.length)%SECTIONS.length;const sec=SECTIONS[current];
  document.documentElement.style.setProperty("--k",sec.k);document.documentElement.style.setProperty("--k2",sec.k2);
  ARTS.forEach(a=>ro.unobserve(a.cv));ARTS.clear();
  const page=el("div","page");
  /* title */
  const tw=el("div","title-wrap");const h=el("h1","stitle");h.setAttribute("aria-label",sec.name);
  const word=sec.id==="front"?"The Tech Times":sec.short;
  const r1=el("span","reg r1",word),r2=el("span","reg r2",word);r1.setAttribute("aria-hidden","true");r2.setAttribute("aria-hidden","true");
  const main=el("span","main");main.setAttribute("aria-hidden","true");[...word].forEach((ch,i)=>{const s=el("span","ch",ch===" "?" ":ch);s.style.animationDelay=(i*35)+"ms";main.append(s);});
  h.append(r1,r2,main);tw.append(h);page.append(tw);
  if(sec.id==="front"){h.style.fontSize="clamp(40px,8.4vw,118px)";}
  const list=sec.id==="front"?STORIES.filter(s=>s.front):STORIES.filter(s=>s.sec===sec.id).sort((a,b)=>b.date.localeCompare(a.date));
  const sub=el("div","subline");sub.append(el("span",null,sec.id==="front"?"Oct. 2025 – Oct. 2026 · Vol. I":sec.name),el("span",null,list.length+" stories · Section "+(current+1)+" of "+SECTIONS.length));page.append(sub);

  const lead=sec.id==="front"?list.find(s=>s.front==="lead"):(list.find(s=>s.sum)||list[0]);
  const rest=list.filter(s=>s!==lead);
  const row1=el("div","row1");const heroC=storyCard(lead,"hero",sec);heroC.classList.add("hero");row1.append(heroC);
  const side=el("div","side");side.append(featureBox(sec),numBox(sec));row1.append(side);page.append(row1);

  const row2=el("div","row2");row2.append(crtBox(sec));
  const artCount=sec.id==="front"?3:Math.min(3,rest.length);
  rest.forEach((s,i)=>row2.append(storyCard(s,i<artCount?"pic":"text",sec)));
  page.append(row2);

  const others=SECTIONS.filter((x,i)=>i!==current&&x.id!=="front").slice(0,4);
  if(sec.id!=="front"){
    const row3=el("div","row3");
    const next=SECTIONS[(current+1)%SECTIONS.length];
    others.slice(0,3).forEach(o=>{const s=STORIES.filter(x=>x.sec===o.id).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!s)return;const c=storyCard(s,"mini",sec);c.style.setProperty("--k",o.k);
      const p=el("span","pill","Elsewhere · "+o.short);p.style.borderColor=o.k;p.style.color=o.k;c.prepend(p);row3.append(c);});
    const nb=el("div","box numcard");nb.style.cursor="pointer";nb.style.setProperty("--k",next.k);
    nb.append(el("div","fig","→"),el("p",null,"Next section: "+next.name));nb.querySelector(".fig").style.color=next.k;nb.onclick=()=>go(current+1);
    row3.append(nb);page.append(row3);
  }
  $("page").replaceChildren(page);
  ARTS.forEach(a=>{ro.observe(a.cv);});
  requestAnimationFrame(()=>ARTS.forEach(a=>{a.mask=null;drawArt(a);}));

  const prev=SECTIONS[(current-1+SECTIONS.length)%SECTIONS.length],next=SECTIONS[(current+1)%SECTIONS.length];
  $("tabPrev").textContent=prev.short;$("tabPrev").style.setProperty("--tk",prev.k);$("tabPrev").setAttribute("aria-label","Previous section: "+prev.name);
  $("tabNext").textContent=next.short;$("tabNext").style.setProperty("--tk",next.k);$("tabNext").setAttribute("aria-label","Next section: "+next.name);
  $("mPrev").textContent="← "+prev.short;$("mNext").textContent=next.short+" →";
  document.title=sec.id==="front"?"The Tech Times":sec.short+" · The Tech Times";
  try{history.replaceState(null,"","#"+sec.id);}catch(e){}
}
function go(i){render(i);window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});}
$("tabPrev").onclick=()=>go(current-1);$("tabNext").onclick=()=>go(current+1);
$("mPrev").onclick=()=>go(current-1);$("mNext").onclick=()=>go(current+1);

/* ---------- menu ---------- */
SECTIONS.forEach((s,i)=>{const li=el("li");const b=el("button");b.type="button";const d=el("i");d.style.background=s.k;b.style.setProperty("--hc",s.k);
  const n=s.id==="front"?STORIES.filter(x=>x.front).length:STORIES.filter(x=>x.sec===s.id).length;
  b.append(d,s.name,el("span",null,n+" stories"));b.onclick=()=>{closeMenu();go(i);};li.append(b);$("menuList").append(li);});
let lastFocus=null;
function openMenu(){lastFocus=document.activeElement;$("menu").hidden=false;$("menuClose").focus();}
function closeMenu(){$("menu").hidden=true;if(lastFocus)lastFocus.focus();}
$("menuBtn").onclick=openMenu;$("menuClose").onclick=closeMenu;

/* ---------- reader ---------- */
let readerList=[],readerIdx=0;
function openReader(s){
  lastFocus=document.activeElement;
  const sec=SECTIONS[current];
  readerList=sec.id==="front"?STORIES.filter(x=>x.front):STORIES.filter(x=>x.sec===sec.id).sort((a,b)=>b.date.localeCompare(a.date));
  readerIdx=Math.max(0,readerList.indexOf(s));if(!readerList.includes(s)){readerList=[s];readerIdx=0;}
  showReader();
}
function showReader(){
  const s=readerList[readerIdx];const sec=secOf(s.sec);const R=$("reader");
  const sheet=el("div","sheet");sheet.style.setProperty("--k",sec.k);
  const st=makeArt(s.art,sec.k,0,3);wireArt(st);sheet.append(st.cv);
  const inn=el("div","in");
  const p=el("span","pill",sec.name);p.style.borderColor=sec.k;p.style.color=sec.k;inn.append(p);
  const h=el("h2","hl",s.hl);h.id="rHl";inn.append(h);
  if(s.dek)inn.append(el("p","dek",s.dek));
  if(s.sum)inn.append(el("p","sum",s.sum));
  if(s.why){const w=el("div","why");w.append(el("b",null,"Why it's interesting"),document.createTextNode(s.why));inn.append(w);}
  const by=el("div","by");by.append(el("b",null,fmt(s))," · "+s.src);inn.append(by);
  const acts=el("div","acts");const left=el("div");left.style.display="flex";left.style.gap="8px";
  const pv=el("button","btn","← Prev");pv.type="button";pv.onclick=()=>{readerIdx=(readerIdx-1+readerList.length)%readerList.length;showReader();};
  const nx=el("button","btn","Next →");nx.type="button";nx.onclick=()=>{readerIdx=(readerIdx+1)%readerList.length;showReader();};
  if(readerList.length>1)left.append(pv,nx);
  const right=el("div");right.style.display="flex";right.style.gap="8px";
  const read=ext(el("a","btn k","Read at "+s.src+" ↗"),s.url);const cl=el("button","btn","Close");cl.type="button";cl.onclick=closeReader;
  right.append(read,cl);acts.append(left,right);inn.append(acts);sheet.append(inn);
  R.replaceChildren(sheet);R.hidden=false;
  ro.observe(st.cv);requestAnimationFrame(()=>{st.mask=null;drawArt(st);});
  cl.focus();
}
function closeReader(){$("reader").hidden=true;$("reader").replaceChildren();if(lastFocus)lastFocus.focus();}
$("reader").addEventListener("click",e=>{if(e.target.id==="reader")closeReader();});

$("shuffleBtn").onclick=()=>{const s=STORIES[Math.floor(Math.random()*STORIES.length)];lastFocus=document.activeElement;readerList=[s];readerIdx=0;showReader();};

/* ---------- CRT mode ---------- */
function setCRT(on){
  document.body.classList.toggle("crtmode",on);$("crtfx").hidden=!on;$("crtBtn").setAttribute("aria-pressed",String(on));
  if(on&&!reduce){document.body.classList.add("crt-boot");setTimeout(()=>document.body.classList.remove("crt-boot"),750);}
  try{localStorage.setItem("tt-crt",on?"1":"0");}catch(e){}
}
$("crtBtn").onclick=()=>setCRT(!document.body.classList.contains("crtmode"));
try{if(localStorage.getItem("tt-crt")==="1")setCRT(true);}catch(e){}

/* ---------- keys ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("reader").hidden)closeReader();else if(!$("menu").hidden)closeMenu();return;}
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(!$("reader").hidden){if(e.key==="ArrowRight"&&readerList.length>1){readerIdx=(readerIdx+1)%readerList.length;showReader();}if(e.key==="ArrowLeft"&&readerList.length>1){readerIdx=(readerIdx-1+readerList.length)%readerList.length;showReader();}return;}
  if(!$("menu").hidden)return;
  if(e.key==="ArrowRight")go(current+1);else if(e.key==="ArrowLeft")go(current-1);
  else if(e.key==="c"||e.key==="C")setCRT(!document.body.classList.contains("crtmode"));
  else if(e.key==="r"||e.key==="R"){const b=document.querySelector(".crt.box");if(b&&b._load)b._load();}
});

/* ---------- start ---------- */
const startId=(location.hash||"").slice(1);const startIdx=Math.max(0,SECTIONS.findIndex(s=>s.id===startId));
render(startIdx);
</script>
