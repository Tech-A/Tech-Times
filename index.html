<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Tech Times</title>
<meta name="description" content="A daily tech newspaper: live headlines from a dozen outlets and Hacker News, plus the year in review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Daily broadsheet: compact riso masthead, a sticky section bar, a "since you last read" strip, lead + top stories beside a live wire, section desks below, then the year in review. Each desk prints in its own ink. */
:root{
  --paper:#EFEAE0; --card:#FAF7F1; --ink:#17160F; --text:#24221C; --soft:#575348; --hair:rgba(23,22,15,.16); --rule:#17160F;
  --k:#E0452B; --k2:#2155E0; --new:#E0452B; --artbg:#16140F; --artlight:#EFE9DC;
  --crt-bg:#07110C; --crt-fg:#8DFFAE; --crt-dim:#4E9A67;
  --f-title:"Archivo","Arial Black",Impact,sans-serif;
  --f-display:"Instrument Serif","Times New Roman",Georgia,serif;
  --f-head:"Newsreader",Georgia,serif;
  --f-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-crt:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#121210; --card:#1C1B18; --ink:#F1ECE1; --text:#E4DFD3; --soft:#A9A397; --hair:rgba(241,236,225,.14); --rule:#F1ECE1;
  --artbg:#0B0B09; --artlight:#26241F; color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121210; --card:#1C1B18; --ink:#F1ECE1; --text:#E4DFD3; --soft:#A9A397; --hair:rgba(241,236,225,.14); --rule:#F1ECE1;
  --artbg:#0B0B09; --artlight:#26241F; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--text)}
body{font-family:var(--f-head);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--k);outline-offset:3px;border-radius:2px}
.shell{max-width:1360px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* top strip + masthead */
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-ui);font-size:13px;color:var(--soft);padding-block:12px 8px}
.strip b{color:var(--ink);font-weight:600}
.tools{display:flex;gap:6px}
.tbtn{background:transparent;border:1px solid var(--hair);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mast{text-align:center;border-top:2px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:6px 2px}
.mt{margin:0;font-family:var(--f-title);font-weight:900;font-stretch:125%;font-size:clamp(38px,7.2vw,104px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;position:relative;display:inline-block;color:var(--ink)}
.mt .reg{position:absolute;inset:0;pointer-events:none}
.mt .r1{color:var(--k);transform:translate(5px,3px);opacity:.9}
.mt .r2{color:var(--k2);transform:translate(-3px,-2px);opacity:.7}
.mt .main{position:relative}
:root:not([data-theme="dark"]) .mt .reg{mix-blend-mode:multiply}
.motto{font-family:var(--f-display);font-style:italic;font-size:15px;color:var(--soft);padding-bottom:4px}

/* section bar */
.secbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:3px double var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--paper)}
.secbar .shell{display:flex;align-items:center;gap:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--soft);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tab i{width:9px;height:9px;transform:rotate(45deg);background:var(--tk)}
.tab:hover{color:var(--ink);background:var(--hair)}
.tab[aria-current="page"]{background:var(--tk);color:#fff}
.tab[aria-current="page"] i{background:#fff}
.tab .cnt{font-size:11.5px;font-weight:700;background:var(--new);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.tab[aria-current="page"] .cnt{background:#fff;color:var(--tk)}
.search{flex:none;position:relative}
.search input{width:220px;max-width:44vw;background:var(--card);border:1px solid var(--hair);border-radius:999px;padding:7px 14px 7px 34px;font-family:var(--f-ui);font-size:14px}
.search input:focus{outline:2px solid var(--k);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--soft)}

/* briefing bar */
.brief{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:14px 0;font-family:var(--f-ui);font-size:14.5px}
.brief .live{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.pulse{width:9px;height:9px;border-radius:50%;background:#18A558;box-shadow:0 0 0 0 rgba(24,165,88,.6);animation:pulse 2s infinite}
.pulse.off{background:var(--soft);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.brief .newcount{background:var(--new);color:#fff;font-weight:700;border-radius:999px;padding:3px 11px}
.brief .muted{color:var(--soft)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--k);text-decoration:underline;text-underline-offset:3px}

/* ticker */
.ticker{margin-top:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;align-items:stretch;overflow:hidden;font-family:var(--f-ui);font-size:14px}
.ticker .lab{flex:none;background:var(--ink);color:var(--paper);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;padding:8px 12px;display:flex;align-items:center}
.ticker .rail{overflow:hidden;flex:1;min-width:0;display:flex}
.ticker .track{display:flex;gap:34px;padding:8px 17px;white-space:nowrap;animation:tick var(--dur,90s) linear infinite}
.ticker:hover .track,.ticker:focus-within .track{animation-play-state:paused}
.ticker .track a:hover{text-decoration:underline}
.ticker .track b{color:var(--k);font-weight:700;margin-right:6px}
@keyframes tick{to{transform:translateX(-50%)}}

/* new-stories pill */
.newpill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:35;background:var(--new);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-family:var(--f-ui);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:drop .35s ease both}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:0}}

/* layout */
main{padding-block:22px 70px}
.grid-front{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:32px;align-items:start}
.colmain{display:flex;flex-direction:column;gap:26px;min-width:0}
.colside{display:flex;flex-direction:column;gap:24px;min-width:0}
.top4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.bands{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 32px}

/* headings */
.h-band{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:3px double var(--rule);padding-top:10px;margin-top:40px;margin-bottom:16px}
.h-band h2{margin:0;font-family:var(--f-title);font-weight:900;font-stretch:118%;text-transform:uppercase;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.005em;color:var(--ink)}
.h-band span{font-family:var(--f-ui);font-size:14px;color:var(--soft)}
.h-mini{font-family:var(--f-ui);font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--rule);padding-bottom:6px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h-mini small{font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--soft);font-size:12.5px}

/* story pieces */
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.kick .sec{color:var(--sk,var(--k))}
.badge{background:var(--new);color:#fff;border-radius:3px;padding:1px 6px;font-size:10.5px;letter-spacing:.08em}
.badge.arch{background:transparent;color:var(--soft);border:1px solid var(--hair)}
.meta{font-family:var(--f-ui);font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.meta .src{font-weight:600;color:var(--text)}
.meta a.hn{color:#E26A17;font-weight:600}
.meta a.hn:hover{text-decoration:underline}
.save{background:none;border:0;cursor:pointer;padding:2px 4px;color:var(--soft);font-family:var(--f-ui);font-size:13px;display:inline-flex;align-items:center;gap:4px;border-radius:4px}
.save:hover{color:var(--ink);background:var(--hair)}
.save[aria-pressed="true"]{color:var(--k)}
.sum{margin:0;color:var(--text)}
.read .hd,.read .hl{color:var(--soft)}

.lead{display:flex;flex-direction:column;gap:12px}
.lead .art{aspect-ratio:16/8.2}
.lead .hl{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,3.6vw,50px);line-height:1.02;letter-spacing:-.01em;color:var(--ink);margin:0;text-wrap:balance}
.lead .sum{font-size:18.5px;line-height:1.55;max-width:68ch}
.hl a:hover,.hd a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

.top{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:14px;border-top:1px solid var(--hair)}
.top .art{aspect-ratio:16/7}
.hd{font-family:var(--f-head);font-weight:650;font-size:21px;line-height:1.22;color:var(--ink);margin:0;text-wrap:pretty}
.top .sum{font-size:16px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.art{display:block;width:100%;background:var(--artbg);cursor:crosshair}

/* list rows */
.list{list-style:none;margin:0;padding:0}
.list li{padding:11px 0;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:4px}
.list li:last-child{border-bottom:0}
.list .hd{font-size:17.5px;font-weight:600;line-height:1.3}
.list .when{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--k);font-variant-numeric:tabular-nums}
.timegroup{font-family:var(--f-ui);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);padding:12px 0 2px;border-bottom:0!important}

/* section band */
.band{display:flex;flex-direction:column;min-width:0}
.band .h-mini{border-bottom-color:var(--sk)}
.band .h-mini button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--sk)}
.band .h-mini button:hover{text-decoration:underline}

/* explainer + number */
.feature{background:var(--card);border:1px solid var(--k);outline:1px solid var(--k);outline-offset:-7px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:6px 6px 0 var(--k2)}
.feature .lab{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--k)}
.feature .medal{width:112px;height:112px;border-radius:50%;overflow:hidden;border:1px solid var(--k)}
.feature .medal canvas{width:100%;height:100%;display:block}
.feature h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;color:var(--ink)}
.feature p{margin:0;font-size:16px;line-height:1.5}
.numcard{border:1px solid var(--k);background:var(--card);text-align:center;padding:18px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.numcard .fig{font-family:var(--f-title);font-weight:800;font-stretch:112%;font-size:clamp(40px,4vw,56px);line-height:1;color:var(--k);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.numcard p{margin:0;font-size:15.5px;max-width:30ch}
.numcard a{font-family:var(--f-ui);font-size:12px;color:var(--soft);text-decoration:underline}

/* lens */
.lens-zone{position:relative;border:1px solid var(--hair);background:var(--paper);height:140px;overflow:hidden;width:100%;touch-action:none}
.lens-zone .bg{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px 8px;padding:10px;font-family:var(--f-title);font-weight:900;font-stretch:120%;font-size:21px;line-height:1;text-transform:uppercase;user-select:none;color:var(--ink)}
.lens-zone .bg span:nth-child(3n){color:var(--k)}.lens-zone .bg span:nth-child(3n+1){color:var(--k2)}
.lens{position:absolute;width:96px;height:62px;border-radius:999px;left:24px;top:38px;cursor:grab;
  -webkit-backdrop-filter:blur(2px) saturate(190%) brightness(1.1) contrast(1.1);backdrop-filter:blur(2px) saturate(190%) brightness(1.1) contrast(1.1);
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 45%,rgba(255,255,255,.25));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -6px 14px rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.7)}
.lens-hint{font-family:var(--f-ui);font-size:12px;color:var(--soft)}

/* CRT */
.crt{background:var(--crt-bg);color:var(--crt-fg);position:relative;overflow:hidden;border-radius:14px;box-shadow:inset 0 0 0 6px #0d0d0d,inset 0 0 40px rgba(0,0,0,.9),0 8px 0 -3px var(--k)}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.84}52%{opacity:.96}}
.crt .scr{position:relative;z-index:2;padding:16px 18px 14px;font-family:var(--f-crt);font-size:20px;line-height:1.15;text-shadow:0 0 6px rgba(141,255,174,.55),1px 0 0 rgba(255,60,90,.35),-1px 0 0 rgba(60,140,255,.35)}
.crt .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px dashed var(--crt-dim);padding-bottom:6px;margin-bottom:8px}
.crt .head button{background:none;border:1px solid var(--crt-dim);color:var(--crt-fg);font-family:var(--f-crt);font-size:18px;padding:0 7px;cursor:pointer}
.crt .head button:hover{background:var(--crt-fg);color:var(--crt-bg)}
.crt ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.crt li a{display:block}
.crt li a:hover{background:var(--crt-fg);color:var(--crt-bg);text-shadow:none}
.crt .m{color:var(--crt-dim);font-size:17px}
.crt .m a{color:var(--crt-dim);text-decoration:underline}
.crt .cursor{display:inline-block;width:9px;height:17px;background:var(--crt-fg);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.crt .foot{color:var(--crt-dim);font-size:17px;margin-top:10px}

/* archive carousel */
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,300px);gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px}
.acard{scroll-snap-align:start;background:var(--card);border:1px solid var(--hair);display:flex;flex-direction:column;gap:8px;padding:12px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}
.acard:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--sk)}
.acard .art{aspect-ratio:16/9}
.acard .hd{font-size:18.5px}
.archgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.carnav{display:flex;gap:6px}
.carnav button{background:var(--card);border:1px solid var(--hair);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.carnav button:hover{border-color:var(--ink)}

.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}

/* section page header */
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sechead h1{margin:0;font-family:var(--f-title);font-weight:900;font-stretch:125%;font-size:clamp(40px,7vw,96px);line-height:.92;text-transform:uppercase;color:var(--ink);position:relative}
.sechead h1 .reg{position:absolute;inset:0;pointer-events:none}
.sechead h1 .r1{color:var(--k);transform:translate(5px,3px);opacity:.9}
.sechead h1 .r2{color:var(--k2);transform:translate(-3px,-2px);opacity:.7}
.sechead h1 .main{position:relative}
.sechead p{margin:0;font-family:var(--f-ui);font-size:14.5px;color:var(--soft)}
.empty{font-family:var(--f-ui);font-size:15px;color:var(--soft);padding:18px;border:1px dashed var(--hair);background:var(--card)}

/* reader */
.reader{position:fixed;inset:0;z-index:60;background:rgba(10,10,8,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);max-width:720px;width:100%;max-height:100%;overflow:auto;border:1px solid var(--rule);box-shadow:10px 10px 0 var(--sk);animation:up .25s ease both}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet .art{aspect-ratio:16/7.5}
.sheet .in{padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px}
.sheet .hl{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,44px);line-height:1.04;color:var(--ink);margin:0}
.sheet .dek{font-size:19px;font-style:italic;margin:0;color:var(--ink)}
.sheet .sum{font-size:18px}
.why{border-left:4px solid var(--sk,var(--k));padding:4px 0 4px 12px;font-size:17px}
.why b{display:block;font-family:var(--f-ui);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sk,var(--k))}
.acts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:12px}
.acts div{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--f-ui);font-size:14px;font-weight:600;border:1px solid var(--rule);background:var(--card);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.k{background:var(--sk,var(--k));border-color:var(--sk,var(--k));color:#fff}

footer{border-top:3px double var(--rule);padding-block:12px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-ui);font-size:13px;color:var(--soft)}
kbd{font-family:var(--f-ui);font-size:12px;border:1px solid var(--hair);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}


/* toolbox */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tcar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,280px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px}
.tcar .tool{scroll-snap-align:start}
.tool{background:var(--card);border:1px solid var(--hair);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .15s,box-shadow .15s}
.tool:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--tk)}
.tool-top{display:flex;gap:12px;align-items:center}
.mono{width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--tk);color:#fff;font-family:var(--f-title);font-weight:900;font-stretch:125%;font-size:25px;line-height:1;text-shadow:3px 2px 0 rgba(0,0,0,.28)}

    if(st.mx>=0){const dm=Math.hypot(x-mx,y-my);v*=1+.6*Math.max(0,1-dm/9)*Math.sin(dm*.9-st.t*.012);}
    if(v<.05)continue;const rad=Math.min(.62,Math.sqrt(v)*.6)*cell;
    c.fillStyle=dark?(shape>.3?`rgb(${ir},${ig},${ib})`:`rgba(238,232,220,${.3+.5*light})`):(shape>.3?lightInk:`rgba(${ir},${ig},${ib},.85)`);
    c.beginPath();c.arc(x*cell+cell/2,y*cell+cell/2,rad,0,6.283);c.fill();

}
function wireArt(st){
  const cv=st.cv;
  cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();st.mx=(e.clientX-r.left)/r.width;st.my=(e.clientY-r.top)/r.height;st.lx=st.mx;st.ly=st.my;if(!st.anim)animate(st);});
  cv.addEventListener("pointerleave",()=>{st.mx=-1;st.lx=.3;st.ly=.25;st.anim=false;drawArt(st);});
}
function animate(st){if(reduce){drawArt(st);return;}st.anim=true;const step=t=>{if(!st.anim||st.mx<0)return;st.t=t;drawArt(st);requestAnimationFrame(step);};requestAnimationFrame(step);}

function paintArts(){ARTS.forEach(a=>{ro.observe(a.cv);});requestAnimationFrame(()=>ARTS.forEach(a=>{a.mask=null;drawArt(a);}));}
function artFor(it){const list=SECTION_ART[it.sec]||["star"];return it.art||list[hash(it.id)%list.length];}

/* ---------- fetching ---------- */
async function fetchFeeds(){
  try{const r=await fetch("news.json?t="+Math.floor(Date.now()/60000),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
    feedUpdated=d.updated?Date.parse(d.updated):null;
    return (d.items||[]).map(x=>({id:"f-"+hash(x.url||x.title),kind:"live",title:String(x.title||""),summary:String(x.summary||""),url:safeUrl(x.url),source:String(x.source||""),time:Date.parse(x.published)||Date.now(),sec:classify(String(x.title||""),String(x.summary||""),String(x.source||""))})).filter(x=>x.url&&x.title);
  }catch(e){return [];}
}
async function fetchHN(){
  try{const r=await fetch("https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=60");if(!r.ok)throw 0;const d=await r.json();
    return (d.hits||[]).filter(h=>h.title).map(h=>{const disc="https://news.ycombinator.com/item?id="+encodeURIComponent(h.objectID);const url=safeUrl(h.url)||disc;
      let host="";try{host=new URL(url).hostname.replace(/^www\./,"");}catch(e){}
      return {id:"h-"+h.objectID,kind:"live",title:h.title,summary:"",url,source:host==="news.ycombinator.com"?"Hacker News":host,time:(h.created_at_i||0)*1000,points:h.points||0,comments:h.num_comments||0,hn:disc,sec:classify(h.title,"",host),viaHN:true};});
  }catch(e){return null;}
}
async function refresh(initial){
  const [feeds,hn]=await Promise.all([fetchFeeds(),fetchHN()]);
  const byUrl=new Map();feeds.forEach(f=>byUrl.set(normUrl(f.url),f));
  const extra=[];
  (hn||[]).forEach(h=>{const m=byUrl.get(normUrl(h.url));if(m){m.points=h.points;m.comments=h.comments;m.hn=h.hn;}else extra.push(h);});
  const cutoff=Date.now()-4*86400000;
  const all=[...feeds,...extra].filter(x=>x.time>cutoff).sort((a,b)=>b.time-a.time);
  HN=hn||[];lastFetch=Date.now();
  const ok=feeds.length||(hn&&hn.length);
  if(initial||!LIVE.length){LIVE=all;render();}
  else{const known=new Set(LIVE.map(x=>x.id));const fresh=all.filter(x=>!known.has(x.id));
    if(fresh.length){pending=all;const p=$("newpill");p.textContent=`↑ ${fresh.length} new ${fresh.length===1?"story":"stories"} · Show`;p.hidden=false;}
    else{LIVE=all;}
  }
  $("pulse").className=ok?"pulse":"pulse off";updateBrief();
}
$("newpill").onclick=()=>{if(pending){LIVE=pending;pending=null;}$("newpill").hidden=true;render();scrollTo({top:0,behavior:reduce?"auto":"smooth"});};
setInterval(()=>refresh(false),10*60*1000);
setInterval(updateBrief,60*1000);

/* ---------- briefing + ticker ---------- */

  const src=feedUpdated?`Wire updated ${ago(feedUpdated)}`:"Live from Hacker News";
  t.textContent=LIVE.length?`${src} · checked ${lastFetch?ago(lastFetch):"now"}`:(lastFetch?"The wire is quiet. Showing the year in review.":"Fetching today's paper…");

    if(fresh){b.append(el("span","newcount",`${fresh} new since you last read`));const m=el("button","linkbtn","Mark all read");m.type="button";m.onclick=()=>{LIVE.filter(isNew).forEach(markRead);render();};b.append(m);}

/* ---------- story pieces ---------- */
function saveBtn(it){

function kicker(it,showSec=true){

function rowPiece(it,{showSec=true,time=false}={}){

function score(it){const age=(Date.now()-it.time)/3600000;return (it.points||0)+(it.viaHN?0:60)*Math.exp(-age/10)+(it.summary?15:0);}

/* ---------- CRT wire ---------- */
function crtBox(sec){
  const box=el("div","crt");const scr=el("div","scr");const head=el("div","head");
  head.append(el("span",null,sec.hnTag?">HN/SHOW_HN":sec.hn?`>HN/${sec.hn.toUpperCase()}`:">HN/MOST_DISCUSSED"));const btn=el("button",null,"[R]efresh");btn.type="button";head.append(btn);
  const ol=el("ol");const foot=el("div","foot");scr.append(head,ol,foot);box.append(scr);
  const load=async()=>{
    ol.replaceChildren();const l=el("li");l.append("DIALING… ",el("span","cursor"));ol.append(l);
    try{
      let hits;
      if(sec.hnTag){const week=Math.floor(Date.now()/1000)-7*86400;const r=await fetch(`https://hn.algolia.com/api/v1/search?tags=${encodeURIComponent(sec.hnTag)}&numericFilters=created_at_i>${week},points>15&hitsPerPage=6`);if(!r.ok)throw 0;hits=(await r.json()).hits||[];}
      else if(sec.hn){const week=Math.floor(Date.now()/1000)-7*86400;const r=await fetch(`https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(sec.hn)}&tags=story&numericFilters=created_at_i>${week},points>30&hitsPerPage=6`);if(!r.ok)throw 0;hits=(await r.json()).hits||[];}
      else{const r=await fetch("https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=40");if(!r.ok)throw 0;hits=((await r.json()).hits||[]).sort((a,b)=>(b.num_comments||0)-(a.num_comments||0)).slice(0,6);}
      ol.replaceChildren();if(!hits.length)ol.append(el("li",null,"NO SIGNAL THIS WEEK."));
      hits.filter(h=>h.title).forEach((h,i)=>{const li=el("li");const disc="https://news.ycombinator.com/item?id="+encodeURIComponent(h.objectID);
        const a=ext(el("a"),safeUrl(h.url)||disc);li.append(a);const m=el("div","m",`${h.points||0} PTS · `);m.append(ext(el("a",null,`${h.num_comments||0} COMMENTS`),disc));li.append(m);ol.append(li);
        typeText(a,`${String(i+1).padStart(2,"0")} ${h.title}`,i*110);});
      foot.textContent="SYNCED "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+" · LIVE";
    }catch(e){ol.replaceChildren();ol.append(el("li",null,"CARRIER LOST. PRESS [R] TO RETRY."));foot.textContent="";}
  };
  btn.onclick=load;box._load=load;load();return box;
}
function typeText(node,text,delay){if(reduce){node.textContent=text;return;}let i=0;setTimeout(function tick(){node.textContent=text.slice(0,i+=3);if(i<text.length)setTimeout(tick,14);},delay);}

function featureBox(sec){
  if(sec.feat.palette)return paletteBox(sec);
  if(sec.feat.tod)return todBox(sec);
  const f=sec.feat;const b=el("div","feature");b.append(el("div","lab",f.lab));
  const medal=el("div","medal");const st=makeArt(f.art,sec.k,1);medal.append(st.cv);b.append(medal,el("h3",null,f.h),el("p",null,f.p));
  if(f.lens){const z=el("div","lens-zone");const bg=el("div","bg");"Liquid Glass refracts blurs tints iOS 27 Apple design depth light".split(" ").forEach(w=>bg.append(el("span",null,w)));
    const lens=el("div","lens");lens.tabIndex=0;lens.setAttribute("role","slider");lens.setAttribute("aria-label","Glass lens, drag or use arrow keys");z.append(bg,lens);b.append(z,el("div","lens-hint","Drag the glass, or focus it and use arrow keys"));
    let drag=null;const clamp=(x,y)=>{const W=z.clientWidth-lens.offsetWidth,H=z.clientHeight-lens.offsetHeight;lens.style.left=Math.max(0,Math.min(W,x))+"px";lens.style.top=Math.max(0,Math.min(H,y))+"px";};
    lens.addEventListener("pointerdown",e=>{drag={x:e.clientX-lens.offsetLeft,y:e.clientY-lens.offsetTop};lens.setPointerCapture(e.pointerId);});
    lens.addEventListener("pointermove",e=>{if(drag)clamp(e.clientX-drag.x,e.clientY-drag.y);});lens.addEventListener("pointerup",()=>drag=null);
    lens.addEventListener("keydown",e=>{const d={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(!d)return;e.preventDefault();e.stopPropagation();clamp(lens.offsetLeft+d[0],lens.offsetTop+d[1]);});}
  return b;
}
function numBox(n){const b=el("div","numcard");const fig=el("div","fig",n.fig);b.append(fig,el("p",null,n.text),ext(el("a",null,n.src),n.url));countUp(fig,n.fig);return b;}
function countUp(node,text){const m=text.match(/^([^\d]*)([\d,]*\.?\d+)(.*)$/);if(!m||reduce)return;const pre=m[1],raw=m[2],post=m[3];const target=parseFloat(raw.replace(/,/g,""));const dec=(raw.split(".")[1]||"").length;const commas=raw.includes(",");const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/1000);const e=1-Math.pow(1-p,3);let v=(target*e).toFixed(dec);if(commas)v=Number(v).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});node.textContent=pre+v+post;if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

/* ---------- pages ---------- */
function setInks(sec){document.documentElement.style.setProperty("--k",sec.k);document.documentElement.style.setProperty("--k2",sec.k2);}
function render(){
  ARTS.forEach(a=>ro.unobserve(a.cv));ARTS.clear();

}
function renderFront(main){
  setInks(SECTIONS[0]);document.title="The Tech Times";
  const pool=LIVE.length?LIVE:[...ARCHIVE].sort((a,b)=>b.time-a.time);
  const recent=pool.filter(x=>x.kind==="archive"||Date.now()-x.time<36*3600000);
  const ranked=[...(recent.length>=5?recent:pool)].sort((a,b)=>score(b)-score(a));
  const lead=ranked[0];const tops=[];const used=new Set([lead.id]);
  for(const it of ranked){if(tops.length>=4)break;if(used.has(it.id))continue;if(tops.some(t=>t.sec===it.sec)&&ranked.length>12)continue;tops.push(it);used.add(it.id);}
  const g=el("div","grid-front");const cm=el("div","colmain");cm.append(leadPiece(lead));
  const t4=el("div","top4");tops.forEach((it,i)=>t4.append(topPiece(it,i<2)));cm.append(t4);
  const cs=el("div","colside");

  const hm=latest.firstChild;hm.append(el("small",null,LIVE.length?`${LIVE.length} stories, last 4 days`:"Year in review"));
  const ul=el("ul","list");let lastGroup="";
  pool.filter(x=>!used.has(x.id)).slice(0,14).forEach(it=>{
    if(it.kind==="live"){const h=(Date.now()-it.time)/3600000;const grp=h<1?"Last hour":h<24?"Today":h<48?"Yesterday":"Earlier";if(grp!==lastGroup){ul.append(el("li","timegroup",grp));lastGroup=grp;}}
    ul.append(rowPiece(it,{time:true}));});
  latest.append(ul);cs.append(latest,todBox(secOf("tools")),crtBox(SECTIONS[0]));
  g.append(cm,cs);main.append(g);

  /* desks */
  const bh=el("div","h-band");bh.append(el("h2",null,"The Desks"),el("span",null,"Latest from every section"));main.append(bh);
  const bands=el("div","bands");
  SECTIONS.slice(1).forEach((s,i)=>{
    const items=pool.filter(x=>x.sec===s.id&&!used.has(x.id)).slice(0,4);
    const list=items.length?items:ARCHIVE.filter(x=>x.sec===s.id).sort((a,b)=>b.time-a.time).slice(0,3);
    const band=el("section","band");band.style.setProperty("--sk",s.k);
    const h=el("h3","h-mini");const nb=el("button",null,s.name+" →");nb.type="button";nb.onclick=()=>go(i+1);h.append(nb);
    const nNew=pool.filter(x=>x.sec===s.id&&isNew(x)).length;if(nNew)h.append(el("small",null,nNew+" new"));
    band.append(h);const l=el("ul","list");list.forEach(it=>l.append(rowPiece(it,{showSec:false,time:true})));band.append(l);bands.append(band);
  });
  main.append(bands);

  const nh=el("div","h-band");nh.append(el("h2",null,"By the Numbers"));main.append(nh);
  const nums=el("div","nums");SECTIONS.forEach(s=>nums.append(numBox(s.num)));main.append(nums);
}
function renderSection(main,sec){
  setInks(sec);document.title=sec.short+" · The Tech Times";
  const head=el("div","sechead");const h=el("h1");h.setAttribute("aria-label",sec.name);

const TOOL_GROUPS={design:["Design","Color & Type","Motion & 3D","Icons & Assets"],dev:["Editors","AI Coding","Terminal","Productivity","APIs & Data","Backend","Web Dev"]};
const CAT_INK={"Design":"#0094B0","Color & Type":"#E0452B","Motion & 3D":"#9B3FD1","Icons & Assets":"#C98200","Editors":"#1F7AE0","AI Coding":"#E0307F","Terminal":"#0E9F6E","Productivity":"#6B4EFF","APIs & Data":"#0F8B8D","Backend":"#5F8A00","Web Dev":"#E8590C"};
let toolState=store.get("tt-tools",{});
const toolId=t=>t.n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
function dayIndex(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);}
function toolOfDay(off=0){return TOOLS[(dayIndex()*7+off)%TOOLS.length];}
function refreshToolProgress(){
  const vals=Object.values(toolState);const tried=vals.filter(v=>v==="tried").length,want=vals.filter(v=>v==="want").length;
  document.querySelectorAll(".tprogress").forEach(n=>{n.textContent=`You've tried ${tried} of ${TOOLS.length}`+(want?` · ${want} on your list`:"");});
}
function toolCard(t){
  const k=CAT_INK[t.c]||"#17160F";const c=el("article","tool");c.style.setProperty("--tk",k);const id=toolId(t);
  const top=el("div","tool-top");const mono=el("div","mono",t.n[0].toUpperCase());mono.setAttribute("aria-hidden","true");
  const tt=el("div");tt.style.minWidth="0";tt.append(el("div","tcat",t.c),el("h3","tname",t.n));top.append(mono,tt);
  c.append(top,el("p","tdesc",t.d),el("p","twhy",t.w));
  const acts=el("div","tacts");const open=ext(el("a",null,"Open ↗"),t.u);open.setAttribute("aria-label","Open "+t.n);
  const tried=el("button");tried.type="button";const want=el("button");want.type="button";
  const sync=()=>{const st=toolState[id];tried.setAttribute("aria-pressed",String(st==="tried"));want.setAttribute("aria-pressed",String(st==="want"));
    tried.textContent=st==="tried"?"✓ Tried":"Tried it";want.textContent=st==="want"?"★ On my list":"＋ Try later";c.classList.toggle("done",st==="tried");};
  const set=v=>{if(toolState[id]===v)delete toolState[id];else toolState[id]=v;store.set("tt-tools",toolState);document.querySelectorAll(`.tool[data-id="${id}"]`).forEach(x=>x._sync&&x._sync());refreshToolProgress();};
  tried.onclick=()=>set("tried");want.onclick=()=>set("want");
  c.dataset.id=id;c._sync=sync;sync();acts.append(open,tried,want);c.append(acts);return c;
}
function toolboxSection(cats,title){
  const sec=el("section","toolbox");const h=el("div","h-band");h.append(el("h2",null,title));const prog=el("span","tprogress");h.append(prog);sec.append(h);
  const chips=el("div","tfilters");chips.setAttribute("role","group");chips.setAttribute("aria-label","Filter tools");
  const grid=el("div","tgrid");let cat="All",mode="all";
  const draw=()=>{grid.replaceChildren();let list=TOOLS.filter(t=>cats.includes(t.c));if(cat!=="All")list=list.filter(t=>t.c===cat);if(mode!=="all")list=list.filter(t=>toolState[toolId(t)]===mode);
    if(!list.length)grid.append(el("div","empty",mode==="want"?"Nothing on your list yet. Tap ＋ Try later on any tool.":mode==="tried"?"Nothing marked as tried yet.":"No tools here."));
    list.forEach(t=>grid.append(toolCard(t)));
    chips.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.cat?b.dataset.cat===cat&&mode==="all":b.dataset.mode===mode)));};
  const chip=(label,opts,ink)=>{const b=el("button","tf");b.type="button";if(ink){const d=el("i");d.style.background=ink;b.append(d);}b.append(label);Object.assign(b.dataset,opts);
    b.onclick=()=>{if(opts.cat){cat=opts.cat;mode="all";}else{mode=opts.mode;cat="All";}draw();};chips.append(b);};
  chip("All",{cat:"All"});cats.forEach(c=>chip(c,{cat:c},CAT_INK[c]));chip("★ My list",{mode:"want"});chip("✓ Tried",{mode:"tried"});
  sec.append(chips,grid);draw();setTimeout(refreshToolProgress);return sec;
}
function todBox(sec){
  const b=el("div","feature tod");let off=0;const lab=el("div","lab");const body=el("div","todbody");
  const nx=el("button","btn","Show me another");nx.type="button";

function toolBand(){

  const right=el("div");right.style.cssText="display:flex;align-items:center;gap:14px;flex-wrap:wrap";const prog=el("span","tprogress");

function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("");}
function paletteBox(sec){
  const f=sec.feat;const b=el("div","feature");b.style.setProperty("--sk",sec.k);b.append(el("div","lab",f.lab),el("h3",null,f.h),el("p",null,f.p));
  const row=el("div","swatches");const msg=el("div","lens-hint","Click a swatch to copy it");msg.setAttribute("aria-live","polite");
  const roll=()=>{row.replaceChildren();const base=Math.random()*360;const mode=Math.floor(Math.random()*3);
    const hues=mode===0?[0,25,50,75,100]:mode===1?[0,20,180,200,40]:[0,72,144,216,288];
    [24,42,56,72,90].forEach((l0,i)=>{const hex=hsl2hex((base+hues[i])%360,52+Math.random()*38,Math.max(12,Math.min(94,l0+(Math.random()*8-4)))).toUpperCase();
      const sw=el("button","sw");sw.type="button";sw.style.background=hex;sw.style.color=l0>60?"#17160F":"#FFFFFF";sw.setAttribute("aria-label","Copy "+hex);sw.append(el("span",null,hex));
      sw.onclick=()=>{const done=()=>{msg.textContent="Copied "+hex;};try{navigator.clipboard.writeText(hex).then(done,()=>{msg.textContent="Couldn't copy. The code is "+hex;});}catch(e){msg.textContent="Couldn't copy. The code is "+hex;}};
      row.append(sw);});};
  const rb=el("button","btn k","Roll a palette");rb.type="button";rb.onclick=roll;roll();b.append(row,rb,msg);return b;
}

/* ---------- reader (year in review) ---------- */
let lastFocus=null;
function openReader(it){
  lastFocus=document.activeElement;const s=it.raw;const sec=secOf(it.sec);const R=$("reader");
  const sheet=el("div","sheet");sheet.style.setProperty("--sk",sec.k);const art=makeArt(it.art,sec.k,0);sheet.append(art.cv);
  const inn=el("div","in");inn.append(kicker(it));const h=el("h2","hl",it.title);h.id="rHl";inn.append(h);
  if(s.dek)inn.append(el("p","dek",s.dek));if(s.sum)inn.append(el("p","sum",s.sum));
  if(s.why){const w=el("div","why");w.append(el("b",null,"Why it's interesting"),document.createTextNode(s.why));inn.append(w);}
  const m=el("div","meta");m.append(el("span","src",it.source),el("span",null,archDate(s)),saveBtn(it));inn.append(m);
  const acts=el("div","acts");const l=el("div"),r=el("div");
  const sib=ARCHIVE.filter(x=>x.sec===it.sec).sort((a,b)=>b.time-a.time);const idx=sib.indexOf(it);
  if(sib.length>1){const pv=el("button","btn","← Prev");pv.type="button";pv.onclick=()=>openReader(sib[(idx-1+sib.length)%sib.length]);const nx=el("button","btn","Next →");nx.type="button";nx.onclick=()=>openReader(sib[(idx+1)%sib.length]);l.append(pv,nx);}
  const rd=ext(el("a","btn k","Read the story ↗"),it.url);const cl=el("button","btn","Close");cl.type="button";cl.onclick=closeReader;r.append(rd,cl);acts.append(l,r);inn.append(acts);sheet.append(inn);
  R.replaceChildren(sheet);R.hidden=false;ro.observe(art.cv);requestAnimationFrame(()=>{art.mask=null;drawArt(art);});cl.focus();
}
function closeReader(){$("reader").hidden=true;$("reader").replaceChildren();if(lastFocus&&lastFocus.focus)lastFocus.focus();}
$("reader").addEventListener("click",e=>{if(e.target.id==="reader")closeReader();});

/* ---------- toggles ---------- */
function setCRT(on){document.body.classList.toggle("crtmode",on);$("crtfx").hidden=!on;$("crtBtn").setAttribute("aria-pressed",String(on));
  if(on&&!reduce){document.body.classList.add("crt-boot");setTimeout(()=>document.body.classList.remove("crt-boot"),750);}store.set("tt-crt",on);}
function setNight(on){document.documentElement.setAttribute("data-theme",on?"dark":"light");$("nightBtn").setAttribute("aria-pressed",String(on));store.set("tt-night",on);ARTS.forEach(a=>drawArt(a));}
$("crtBtn").onclick=()=>setCRT(!document.body.classList.contains("crtmode"));
$("nightBtn").onclick=()=>setNight($("nightBtn").getAttribute("aria-pressed")!=="true");
if(store.get("tt-crt",false))setCRT(true);
{const n=store.get("tt-night",null);setNight(n===null?matchMedia("(prefers-color-scheme: dark)").matches:n);}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("reader").hidden)closeReader();else if(view.q){$("q").value="";view.q="";render();}return;}
  if(e.target.closest&&e.target.closest("input,textarea,[role=slider]"))return;
  if(!$("reader").hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  const n=SECTIONS.length;const cur=view.sec==="saved"?0:view.sec;
  if(e.key==="ArrowRight")go((cur+1)%n);else if(e.key==="ArrowLeft")go((cur-1+n)%n);
  else if(e.key==="/"){e.preventDefault();$("q").focus();}
  else if(e.key==="c"||e.key==="C")setCRT(!document.body.classList.contains("crtmode"));
  else if(e.key==="n"||e.key==="N")setNight($("nightBtn").getAttribute("aria-pressed")!=="true");
});

{const id=(location.hash||"").slice(1);if(id==="saved")view.sec="saved";else{const i=SECTIONS.findIndex(s=>s.id===id);view.sec=i>0?i:0;}}
render();refresh(true);
