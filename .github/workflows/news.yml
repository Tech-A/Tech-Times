name: Update the news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/news.yml"]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- news.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "tech-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
